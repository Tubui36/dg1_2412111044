<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<h1>{{ title }}</h1>
<table>
  <tr><th>ID</th><th>MSSV</th><th>Họ tên</th><th>Lớp</th><th>Điểm</th></tr>
  {% for s in students %}
  <tr><td>{{ s.id }}</td><td>{{ s.mssv }}</td><td>{{ s.ho_ten }}</td><td>{{ s.lop }}</td><td>{{ s.diem }}</td></tr>
  {% endfor %}
</table>
</body></html>
