services:
  web:
    build: .
    image: dg1-2412111044:1.0
    container_name: dg1-web
    volumes:
      - ./app/data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dg1-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
